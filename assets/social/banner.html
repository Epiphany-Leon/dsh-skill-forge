<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-skill-forge — 发布 Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    color: #f1f5f9;
    overflow: hidden;
    position: relative;
  }

  /* 装饰性光斑 */
  .glow-1 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
    top: -100px;
    right: -100px;
    border-radius: 50%;
  }
  .glow-2 {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
    bottom: -50px;
    left: 200px;
    border-radius: 50%;
  }

  .container {
    display: flex;
    height: 100%;
    padding: 60px 80px;
    gap: 60px;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  .left {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.3);
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    color: #93c5fd;
    margin-bottom: 24px;
    width: fit-content;
  }
  .badge-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1 {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .subtitle {
    font-size: 22px;
    line-height: 1.5;
    color: #cbd5e1;
    margin-bottom: 32px;
    font-weight: 400;
  }

  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
  }
  .feature-tag {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    font-size: 14px;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .feature-tag .icon {
    font-size: 16px;
  }

  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
  }

  /* 孵化蛋 Logo */
  .egg-logo {
    width: 280px;
    height: 340px;
    position: relative;
  }
  .egg {
    width: 240px;
    height: 300px;
    background: linear-gradient(180deg, #fef3c7 0%, #fde68a 50%, #fbbf24 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    box-shadow:
      inset -20px -30px 60px rgba(251, 191, 36, 0.3),
      inset 20px 20px 40px rgba(255, 255, 255, 0.3),
      0 20px 60px rgba(251, 191, 36, 0.2);
  }
  .egg::before {
    content: '';
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 36px;
  }
  .eye {
    position: absolute;
    top: 100px;
    width: 28px;
    height: 28px;
    background: #1e293b;
    border-radius: 50%;
  }
  .eye.left { left: 68px; }
  .eye.right { right: 68px; }
  .eye::after {
    content: '';
    position: absolute;
    top: 6px;
    left: 8px;
    width: 10px;
    height: 10px;
    background: white;
    border-radius: 50%;
  }

  .crack {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 60px;
  }
  .crack-line {
    position: absolute;
    background: linear-gradient(90deg, #10b981, #34d399, #10b981);
    border-radius: 2px;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
  }
  .crack-line.horizontal {
    width: 140px;
    height: 6px;
    top: 30px;
    left: 10px;
  }
  .crack-line.up-left {
    width: 40px;
    height: 5px;
    top: 15px;
    left: 15px;
    transform: rotate(-30deg);
    transform-origin: left center;
  }
  .crack-line.up-right {
    width: 50px;
    height: 5px;
    top: 10px;
    right: 20px;
    transform: rotate(25deg);
    transform-origin: right center;
  }
  .crack-line.down-left {
    width: 35px;
    height: 5px;
    bottom: 12px;
    left: 30px;
    transform: rotate(20deg);
    transform-origin: left center;
  }
  .crack-line.down-right {
    width: 45px;
    height: 5px;
    bottom: 10px;
    right: 15px;
    transform: rotate(-25deg);
    transform-origin: right center;
  }

  .glow-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 60%);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  }

  .version-tag {
    padding: 10px 24px;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    color: #6ee7b7;
    letter-spacing: 0.5px;
  }

  .footer {
    position: absolute;
    bottom: 30px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #64748b;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .footer-logo {
    width: 20px;
    height: 20px;
    background: #3b82f6;
    border-radius: 6px;
  }
  .footer-right {
    display: flex;
    gap: 20px;
  }
  .footer-right span {
    display: flex;
    align-items: center;
    gap: 6px;
  }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="left">
      <div class="badge">
        <span class="badge-dot"></span>
        v0.1.0 现已发布
      </div>
      <h1>dsh-skill-forge</h1>
      <p class="subtitle">
        让 Agent 从对话经验中<br>
        自动锻造高质量技能
      </p>
      <div class="features">
        <div class="feature-tag"><span class="icon">🔨</span>七层质量门</div>
        <div class="feature-tag"><span class="icon">🤖</span>多 Agent 协作</div>
        <div class="feature-tag"><span class="icon">🔄</span>验证驱动迭代</div>
        <div class="feature-tag"><span class="icon">🛡️</span>四层安全防御</div>
        <div class="feature-tag"><span class="icon">🔗</span>谱系追踪</div>
        <div class="feature-tag"><span class="icon">🎯</span>意图感知召回</div>
      </div>
    </div>

    <div class="right">
      <div class="egg-logo">
        <div class="glow-ring"></div>
        <div class="egg">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="crack">
            <div class="crack-line horizontal"></div>
            <div class="crack-line up-left"></div>
            <div class="crack-line up-right"></div>
            <div class="crack-line down-left"></div>
            <div class="crack-line down-right"></div>
          </div>
        </div>
      </div>
      <div class="version-tag">✨ 技能孵化中</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-left">
      <div class="footer-logo"></div>
      <span>DeepSeek Harness Plugin</span>
    </div>
    <div class="footer-right">
      <span>📦 npm: dsh-skill-forge</span>
      <span>📄 MIT License</span>
    </div>
  </div>
</body>
</html>
