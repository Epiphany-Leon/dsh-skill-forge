# dsh-skill-forge bundle 配置层
# 安装进 profile 后由 dsh 加载。
- insert:
    - id: dsh-skill-forge
      name: dsh-skill-forge
      config:
        securityLevel: normal
        autoTrigger: true
        triggerThreshold: 0.7
        maxIterations: 3
        verificationPassThreshold: 0.8
        skillCountAlertThreshold: 30
        tokenBudgetRatio: 0.1
        enableDreaming: false
        dreamingSchedule: '0 3 * * 0'
